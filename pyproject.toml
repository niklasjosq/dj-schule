[project]
name = "apc-dj"
version = "0.1.0"
description = "DJ-Schule: interaktives Lernwerkzeug für Kinder mit dem AKAI APC mini mk2"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
apc-dj = "apc_dj.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apc_dj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
